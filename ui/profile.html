<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEZO - الملف الشخصي</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1a6fd4;
            --gold: #FFD700;
            --gold-dark: #FFA500;
            --bg: #f0f4ff;
            --card-bg: #ffffff;
            --text-primary: #1a1a2e;
            --text-secondary: #666;
            --radius-md: 20px;
            --radius-lg: 30px;
            --shadow: 0 8px 24px rgba(26, 111, 212, 0.15);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #e0e7ff;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 390px;
            background-color: var(--bg);
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 50px rgba(0,0,0,0.1);
        }

        /* Header */
        header {
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            background: white;
        }

        .back-btn { font-size: 24px; cursor: pointer; }
        .header-title { font-weight: bold; font-size: 18px; }

        /* Profile Info */
        .profile-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px;
            background: white;
            border-bottom-left-radius: var(--radius-lg);
            border-bottom-right-radius: var(--radius-lg);
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .avatar-wrapper {
            position: relative;
            width: 120px;
            height: 120px;
            margin-bottom: 15px;
        }

        .avatar-main {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid white;
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 2;
        }

        .vip-ring {
            position: absolute;
            width: 120px;
            height: 120px;
            border: 4px solid var(--gold);
            border-radius: 50%;
            box-shadow: 0 0 15px var(--gold);
            animation: rotate 10s linear infinite;
        }

        .vip-ring::before {
            content: '💛';
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 20px;
        }

        .profile-name { font-size: 22px; font-weight: bold; margin-bottom: 5px; }
        .profile-level { 
            background: linear-gradient(45deg, var(--gold), var(--gold-dark));
            color: white;
            padding: 4px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .vip-badge { color: var(--gold-dark); font-weight: bold; font-size: 14px; }

        /* Stats Bar */
        .stats-bar {
            display: flex;
            justify-content: space-around;
            width: 100%;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }

        .stat-item { text-align: center; }
        .stat-value { display: block; font-weight: bold; font-size: 18px; }
        .stat-label { font-size: 12px; color: var(--text-secondary); }

        /* Achievements */
        .section { padding: 20px; }
        .section-title { font-weight: bold; margin-bottom: 15px; font-size: 16px; }

        .achievements-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 10px;
        }

        .badge {
            width: 45px;
            height: 45px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        /* Badge Colors */
        .badge-speaker { background: linear-gradient(135deg, #8E2DE2, #4A00E0); }
        .badge-diamond { background: linear-gradient(135deg, #00c6ff, #0072ff); }
        .badge-vip { background: linear-gradient(135deg, #FFD700, #FFA500); }
        .badge-star { background: linear-gradient(135deg, #f7971e, #ffd200); }
        .badge-fire { background: linear-gradient(135deg, #ff416c, #ff4b2b); }
        .badge-target { background: linear-gradient(135deg, #11998e, #38ef7d); }

        /* Detailed Stats */
        .detailed-stats {
            background: white;
            border-radius: var(--radius-md);
            padding: 15px;
            box-shadow: var(--shadow);
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .detail-row:last-child { border-bottom: none; }
        .detail-label { color: var(--text-secondary); font-size: 14px; }
        .detail-value { font-weight: bold; font-size: 14px; }

        /* Actions */
        .actions {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 30px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 15px;
            border: none;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-edit { background: var(--primary); color: white; }
        .btn-settings { background: #e2e8f0; color: var(--text-primary); }
        .btn:active { opacity: 0.8; }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header>
            <div class="back-btn">→</div>
            <div class="header-title">الملف الشخصي</div>
        </header>

        <div class="profile-info">
            <div class="avatar-wrapper">
                <div class="vip-ring"></div>
                <img src="https://picsum.photos/seed/ahmad/200/200" class="avatar-main" alt="Avatar">
            </div>
            <h1 class="profile-name">أحمد MEZO</h1>
            <div class="profile-level">⭐ المستوى 24 ⭐</div>
            <div class="vip-badge">👑 VIP</div>

            <div class="stats-bar">
                <div class="stat-item">
                    <span class="stat-value">245</span>
                    <span class="stat-label">أصدقاء</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value">1,832</span>
                    <span class="stat-label">هدايا</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value">128</span>
                    <span class="stat-label">ساعات</span>
                </div>
            </div>
        </div>

        <div class="section">
            <div class="section-title">🏆 الإنجازات</div>
            <div class="achievements-grid">
                <div class="badge badge-speaker">🎤</div>
                <div class="badge badge-diamond">💎</div>
                <div class="badge badge-vip">👑</div>
                <div class="badge badge-star">🌟</div>
                <div class="badge badge-fire">🔥</div>
                <div class="badge badge-target">🎯</div>
                <div class="badge badge-speaker" style="opacity: 0.5;">🏆</div>
                <div class="badge badge-diamond" style="opacity: 0.5;">💫</div>
                <div class="badge badge-vip" style="opacity: 0.5;">🎪</div>
                <div class="badge badge-star" style="opacity: 0.5;">🌈</div>
                <div class="badge badge-fire" style="opacity: 0.5;">⚡</div>
                <div class="badge badge-target" style="opacity: 0.5;">🎭</div>
            </div>
        </div>

        <div class="section">
            <div class="section-title">📊 الإحصائيات</div>
            <div class="detailed-stats">
                <div class="detail-row">
                    <span class="detail-label">الغرف المُنشأة:</span>
                    <span class="detail-value">12</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">الهدايا المُستلمة:</span>
                    <span class="detail-value">4,521</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">أطول جلسة:</span>
                    <span class="detail-value">4 ساعات</span>
                </div>
            </div>
        </div>

        <div class="actions">
            <button class="btn btn-edit">✏️ تعديل الملف الشخصي</button>
            <button class="btn btn-settings">⚙️ الإعدادات</button>
        </div>
    </div>
</body>
</html>
